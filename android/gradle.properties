org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Gradle's default 30s HTTP timeout is not enough to pull the Android build
# tools from dl.google.com on a slow link — the first build times out
# repeatedly. These artifacts are downloaded once and then cached.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

# Kotlin's incremental compilation caches repeatedly failed to close on this
# Windows checkout ("Could not close incremental caches ... .tab"), failing
# every release build. A release build is rare and compiles from scratch
# anyway, so the incremental machinery buys nothing here.
kotlin.incremental=false
