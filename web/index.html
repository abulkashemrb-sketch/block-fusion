<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fill lines, fuse blocks, and beat your best score in this Block Blast style puzzle game.">
  <meta name="theme-color" content="#5B4BD6">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Block Fusion">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Block Fusion</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Flutter's service worker caches the whole app so it can run offline.
    // The cost is that a player who already has it keeps running the old
    // build: the worker installs a new version in the background but waits
    // for every tab to close before taking over, which for a game people
    // leave open can be days.
    //
    // This asks the browser to check for a new worker on each load and, if
    // one is waiting, reloads once as soon as it takes control. The guard
    // is what stops that from becoming a loop — controllerchange also fires
    // on the very first install, when there is nothing to update to.
    if ('serviceWorker' in navigator) {
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading) return;
        reloading = true;
        window.location.reload();
      });
      navigator.serviceWorker.ready.then((registration) => {
        // Only meaningful once a worker is already in charge; without this
        // the first visit would reload itself for no reason.
        if (navigator.serviceWorker.controller) registration.update();
      });
    }
  </script>
</body>
</html>
